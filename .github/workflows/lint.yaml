name: Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# Disable permissions for all available scopes
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Trunk Check
    permissions:
      actions: write # Enable GitHub Action caching for Trunk
      contents: read # Required by the checkout step
      checks: write # Required for annotations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Run with the '--all' argument for trunk upgrades to validate the upgrades
      # do not introduce new issues. This is run in a separate step to keep the
      # arguments logic simple.
      - name: Run Code Quality
        if: github.head_ref == 'trunk-io/update-trunk'
        uses: trunk-io/trunk-action@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          arguments: --all
